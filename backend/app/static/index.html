<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Data Contract Sentinel</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #9aa1ad;
    --accent: #5b9dff;
    --danger: #ff6b6b;
    --warn: #ffb454;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  header { padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
  header p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  main { max-width: 1100px; margin: 0 auto; padding: 2rem; display: grid; gap: 1.5rem; }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
  }
  section h2 { margin-top: 0; font-size: 1.1rem; }
  .score-row { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 0.5rem; }
  .score-value { font-size: 2.5rem; font-weight: 700; color: var(--accent); }
  .score-label { color: var(--muted); }
  .formula { color: var(--muted); font-size: 0.8rem; margin-bottom: 1rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.added { background: rgba(74,222,128,0.15); color: var(--ok); }
  .badge.removed { background: rgba(255,107,107,0.15); color: var(--danger); }
  .badge.type_changed { background: rgba(255,107,107,0.15); color: var(--danger); }
  .badge.nullable_tightened { background: rgba(255,107,107,0.15); color: var(--danger); }
  .badge.nullable_relaxed { background: rgba(74,222,128,0.15); color: var(--ok); }
  .badge.possibly_renamed { background: rgba(255,180,84,0.15); color: var(--warn); }
  .consumers { color: var(--muted); font-size: 0.8rem; }
  .rec-list { margin: 0; padding-left: 1.2rem; }
  .rec-list li { margin-bottom: 0.4rem; }
  .empty { color: var(--muted); font-style: italic; font-size: 0.85rem; }
  .error { color: var(--danger); font-size: 0.9rem; }
  code { background: #1f232c; padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.85em; }
  .contracts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  .contracts-grid h3 { margin: 0 0 0.4rem; font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .replay-summary { display: flex; gap: 2rem; margin-bottom: 1rem; }
  .replay-summary .stat { }
  .replay-summary .stat .n { font-size: 1.6rem; font-weight: 700; }
  .replay-summary .stat .label { color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<header>
  <h1>Data Contract Sentinel</h1>
  <p>Schema-drift detection between two contract versions, with a risk score and a replay of real records against the proposed contract.</p>
</header>
<main>
  <section id="contracts-section">
    <h2>Contracts</h2>
    <div id="contracts-content">Loading…</div>
  </section>

  <section id="diff-section">
    <h2>Diff &amp; Risk Score</h2>
    <div id="diff-content">Loading…</div>
  </section>

  <section id="replay-section">
    <h2>Replay Against Historical Records</h2>
    <div id="replay-content">Loading…</div>
  </section>
</main>

<script>
async function fetchJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url} -> HTTP ${res.status}`);
  return res.json();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function fieldsTable(fields) {
  return `
    <table>
      <thead><tr><th>Field</th><th>Type</th><th>Nullable</th></tr></thead>
      <tbody>
        ${fields.map((f) => `
          <tr>
            <td><code>${escapeHtml(f.name)}</code></td>
            <td>${escapeHtml(f.type)}</td>
            <td>${f.nullable ? "yes" : "no"}</td>
          </tr>`).join("")}
      </tbody>
    </table>`;
}

async function loadContracts() {
  const el = document.getElementById("contracts-content");
  try {
    const data = await fetchJson("/api/contracts");
    el.innerHTML = `
      <div class="contracts-grid">
        <div>
          <h3>Current (${escapeHtml(data.current.version)})</h3>
          ${fieldsTable(data.current.fields)}
        </div>
        <div>
          <h3>Proposed (${escapeHtml(data.proposed.version)})</h3>
          ${fieldsTable(data.proposed.fields)}
        </div>
      </div>`;
  } catch (err) {
    el.innerHTML = `<span class="error">Failed to load contracts: ${escapeHtml(err.message)}</span>`;
  }
}

async function loadDiff() {
  const el = document.getElementById("diff-content");
  try {
    const data = await fetchJson("/api/contracts/diff");
    el.innerHTML = `
      <div class="score-row">
        <span class="score-value">${data.total_risk_score}</span>
        <span class="score-label">total risk points (${escapeHtml(data.old_version)} &rarr; ${escapeHtml(data.new_version)})</span>
      </div>
      <p class="formula"><code>${escapeHtml(data.risk_formula)}</code></p>
      <table>
        <thead><tr><th>Change</th><th>Field</th><th>Detail</th><th>Affected Consumers</th><th>Risk</th></tr></thead>
        <tbody>
          ${data.changes.map((c) => `
            <tr>
              <td><span class="badge ${c.change_type}">${c.change_type.replaceAll("_", " ")}</span></td>
              <td><code>${escapeHtml(c.field_name)}</code></td>
              <td>${escapeHtml(c.detail)}</td>
              <td class="consumers">${c.affected_consumers.length ? c.affected_consumers.map(escapeHtml).join(", ") : "none known"}</td>
              <td>${c.risk_points}</td>
            </tr>`).join("")}
        </tbody>
      </table>
      <h3 style="margin-top:1.25rem; font-size:0.85rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em;">Migration Recommendations</h3>
      ${data.migration_recommendations.length
        ? `<ul class="rec-list">${data.migration_recommendations.map((r) => `<li>${escapeHtml(r)}</li>`).join("")}</ul>`
        : `<span class="empty">None.</span>`}`;
  } catch (err) {
    el.innerHTML = `<span class="error">Failed to load diff: ${escapeHtml(err.message)}</span>`;
  }
}

async function loadReplay() {
  const el = document.getElementById("replay-content");
  try {
    const data = await fetchJson("/api/contracts/replay");
    el.innerHTML = `
      <div class="replay-summary">
        <div class="stat"><div class="n">${data.records_checked}</div><div class="label">records replayed</div></div>
        <div class="stat"><div class="n">${data.records_with_violations}</div><div class="label">with violations</div></div>
        <div class="stat"><div class="n">${data.violations.length}</div><div class="label">total violations</div></div>
      </div>
      ${data.violations.length
        ? `<table>
            <thead><tr><th>Record #</th><th>Field</th><th>Reason</th></tr></thead>
            <tbody>
              ${data.violations.map((v) => `
                <tr>
                  <td>${v.record_index}</td>
                  <td><code>${escapeHtml(v.field_name)}</code></td>
                  <td>${escapeHtml(v.reason)}</td>
                </tr>`).join("")}
            </tbody>
          </table>`
        : `<span class="empty">No violations -- every historical record satisfies the proposed contract.</span>`}`;
  } catch (err) {
    el.innerHTML = `<span class="error">Failed to load replay: ${escapeHtml(err.message)}</span>`;
  }
}

loadContracts();
loadDiff();
loadReplay();
</script>
</body>
</html>
